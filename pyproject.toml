[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "imaginarium-forge"
version = "0.4.0.dev16"
description = "Local-first story, character, worldbuilding and media-prompt studio"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.4,<3",
  "httpx>=0.27,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "streamlit>=1.60,<2",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
# Kept for `pip install -e ".[dev]"` compatibility. The AUTHORITATIVE lock is
# `uv.lock` (A3-19); see docs/DEPENDENCY_WORKFLOW.md.
dev = [
  "pytest>=8,<9",
  "types-PyYAML>=6,<7",
  "ruff>=0.5,<1",
  "mypy>=1.10,<2",
  "build>=1.2,<2",
]

# A3-19: dependency intent lives here and is locked by `uv lock`.
[dependency-groups]
test = ["pytest>=8,<9"]
quality = ["ruff>=0.5,<1", "mypy>=1.10,<2", "types-PyYAML>=6,<7"]
packaging = ["build>=1.2,<2"]
dev = [
  { include-group = "test" },
  { include-group = "quality" },
  { include-group = "packaging" },
]

[tool.hatch.build.targets.wheel]
packages = ["src/imaginarium_forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "ollama: requires a reachable local Ollama server (skipped automatically when absent)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# RUF001-003 flag fullwidth CJK punctuation as "ambiguous"; this is a Traditional
# Chinese project — fullwidth punctuation inside zh-TW strings/comments is correct.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_return_any = true
check_untyped_defs = true
